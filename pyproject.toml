[project]
name = "video-analyser"
version = "0.1.0"
description = "Автоматический анализ видео приёмов в стоматологических клиниках"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "click>=8.1",
    "ffmpeg-python>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0",
]
diarization = [
    "pyannote.audio>=3.3",
]
cv = [
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "pillow>=10.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]