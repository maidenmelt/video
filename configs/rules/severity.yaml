# Критические правила → служебная записка
critical:
  - H    # Грубое общение
  - I    # Курение
  - J    # Дресс-код (грубое)
  - L    # Пациент без записи
  - O    # График работы админа
  - P    # Отсутствие на ресепшене
  - Q    # Запрещённые фразы админа
  - R    # Отказ в записи
  - S    # Непринятие оплаты
  - T    # Нет чека
  - U    # Нет подсчёта купюр
  - V    # Опоздание врача
  - W    # Растягивание приёма
  - X    # Запрещённые фразы врача
  - Y    # Знакомство
  - Z    # Причины обращения
  - AA   # Запрос
  - AB   # Зубная формула
  - AC   # Фотопротокол
  - AD   # Контакт с пациентом
  - AE   # Предложение снимка
  - AF   # Уточнение диагноза
  - AG   # Вопросы
  - AH   # Смежные специалисты
  - AI   # Обсуждение вариантов
  - AJ   # Мотивация «Зачем лечить»
  - AK   # Примеры работ
  - AL   # Запись
  - AM   # Гигиена
  - AN   # Переговорная
  - AO   # Вопросы координатора
  - AP   # Мотивация координатора
  - AQ   # Запись координатора
  - AR   # Обсуждение оплаты
  - AS   # Работа с возражением
  - AT   # Запрещённые фразы координатора

# Мелкие правила → ознакомительная записка
minor:
  - K    # Бейдж / мелочи дресс-кода
  - M    # Встреча пациента
  - N    # Заполнение документации